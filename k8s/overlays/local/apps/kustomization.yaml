apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: hiveapp
resources:
  - ../../../base/apps
patches:
  - patch: |-
      apiVersion: v1
      kind: Service
      metadata:
        name: front
      spec:
        type: NodePort
        ports:
          - port: 80
            targetPort: 80
            nodePort: 30080
  - patch: |-
      apiVersion: v1
      kind: Service
      metadata:
        name: flutter-web
      spec:
        type: NodePort
        ports:
          - port: 80
            targetPort: 80
            nodePort: 30081
