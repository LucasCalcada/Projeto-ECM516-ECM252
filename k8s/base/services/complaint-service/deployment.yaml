apiVersion: apps/v1
kind: Deployment
metadata:
  name: complaint-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: complaint-service
  template:
    metadata:
      labels:
        app: complaint-service
      annotations:
        hiveapp/config-checksum: local-config
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: complaint-service
          image: hiveapp/complaint-service:local
          imagePullPolicy: IfNotPresent
          workingDir: /app
          command:
            - /app/bin/server
          ports:
            - name: http
              containerPort: 8007
          envFrom:
            - configMapRef:
                name: hiveapp-config
            - secretRef:
                name: hiveapp-secrets
          env:
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: hiveapp-secrets
                  key: POSTGRES_USER
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: hiveapp-secrets
                  key: POSTGRES_PASSWORD
            - name: PGDATABASE
              value: complaintDb
            - name: DATABASE_URL
              value: postgresql://$(PGUSER):$(PGPASSWORD)@db:5432/$(PGDATABASE)
            - name: DATABASE_SSL_MODE
              value: disable
            - name: HOST
              value: 0.0.0.0
            - name: PORT
              value: '8007'
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 384Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
      initContainers:
        - name: wait-for-database
          image: postgres:17-alpine
          env:
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: hiveapp-secrets
                  key: POSTGRES_USER
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: hiveapp-secrets
                  key: POSTGRES_PASSWORD
            - name: PGDATABASE
              value: complaintDb
            - name: PGHOST
              value: db
          command:
            - sh
            - -ec
            - until psql -w -v ON_ERROR_STOP=1 -c "SELECT 1" >/dev/null 2>&1; do echo "Waiting for database"; sleep 3; done
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 999
