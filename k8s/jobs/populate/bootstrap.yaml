apiVersion: batch/v1
kind: Job
metadata:
  name: populate-demo-bootstrap
  labels:
    hiveapp/task: populate
    hiveapp/demo: v1
    hiveapp/stage: bootstrap
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 420
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        hiveapp/task: populate
        hiveapp/demo: v1
        hiveapp/stage: bootstrap
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: populate
          image: hiveapp/auth-service:local
          imagePullPolicy: IfNotPresent
          command:
            - node
            - /demo/demo.cjs
            - bootstrap
          envFrom:
            - configMapRef:
                name: hiveapp-config
            - secretRef:
                name: hiveapp-secrets
          env:
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: hiveapp-secrets
                  key: POSTGRES_USER
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: hiveapp-secrets
                  key: POSTGRES_PASSWORD
            - name: PGDATABASE
              value: authDb
            - name: DATABASE_URL
              value: postgresql://$(PGUSER):$(PGPASSWORD)@db:5432/$(PGDATABASE)
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 384Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
          volumeMounts:
            - name: demo-script
              mountPath: /demo
              readOnly: true
      volumes:
        - name: demo-script
          configMap:
            name: hiveapp-demo-script
            defaultMode: 292
