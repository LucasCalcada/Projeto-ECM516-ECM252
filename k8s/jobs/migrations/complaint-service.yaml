apiVersion: batch/v1
kind: Job
metadata:
  name: migrate-complaint-service
  labels:
    hiveapp/task: migrate
    hiveapp/service: complaint-service
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 180
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        hiveapp/task: migrate
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: prepare-databases
          image: postgres:17-alpine
          env:
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: hiveapp-secrets
                  key: POSTGRES_USER
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: hiveapp-secrets
                  key: POSTGRES_PASSWORD
            - name: PGDATABASE
              value: postgres
            - name: PGHOST
              value: db
          command:
            - sh
            - -ec
            - |
              until psql -w -v ON_ERROR_STOP=1 -c "SELECT 1" >/dev/null 2>&1; do
                echo "Waiting for PostgreSQL"
                sleep 3
              done
              psql -w -v ON_ERROR_STOP=1 -f /init/init-dbs.sql
          volumeMounts:
            - name: database-init
              mountPath: /init
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 999
      containers:
        - name: migrate
          image: hiveapp/complaint-service:local
          imagePullPolicy: IfNotPresent
          workingDir: /app
          command:
            - /app/bin/migrate
          envFrom:
            - configMapRef:
                name: hiveapp-config
            - secretRef:
                name: hiveapp-secrets
          env:
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: hiveapp-secrets
                  key: POSTGRES_USER
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: hiveapp-secrets
                  key: POSTGRES_PASSWORD
            - name: PGDATABASE
              value: complaintDb
            - name: DATABASE_URL
              value: postgresql://$(PGUSER):$(PGPASSWORD)@db:5432/$(PGDATABASE)
            - name: DATABASE_SSL_MODE
              value: disable
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 384Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
      volumes:
        - name: database-init
          configMap:
            name: postgres-init
