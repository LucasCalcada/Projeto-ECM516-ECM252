server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Revalidate the app entry points and assets after a new image is deployed.
    add_header Cache-Control "no-cache" always;

    location = /health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api/auth/ {
        proxy_pass http://auth-service:8001/;
    }
    location /api/core/ {
        proxy_pass http://core-service:8000/;
    }
    location /api/delivery/ {
        proxy_pass http://delivery-service:8002/;
    }
    location /api/visitor/ {
        proxy_pass http://visitor-service:8003/;
    }
    location /api/reservation/ {
        proxy_pass http://reservation-service:8005/;
    }
    location /api/communication/ {
        proxy_pass http://communication-service:8006/;
    }
    location /api/complaint/ {
        proxy_pass http://complaint-service:8007/;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
